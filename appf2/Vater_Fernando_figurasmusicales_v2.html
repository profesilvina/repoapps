<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-start p-3 sm:p-6 transition-colors duration-300">

    <!-- ACCESSIBILITY TOOLBAR (DUA / UDL) -->
    <header class="w-full max-w-4xl bg-white dark:bg-slate-800 rounded-2xl shadow-md p-4 mb-6 hc-card border border-slate-200 flex flex-wrap items-center justify-between gap-3">

                <span class="px-1 text-xs text-slate-500 dark:text-slate-300">Fuente</span>
                <button onclick="adjustFontSize(1)" class="px-2 py-1 font-bold text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 rounded" aria-label="Aumentar letra">A+</button>
            </div>

            <!-- Contrast Toggle -->
            <button onclick="toggleHighContrast()" class="px-3 py-1.5 rounded-lg font-semibold text-xs bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900 hover:opacity-90 transition-opacity hc-accent">
                👁️ Alto Contraste
            </button>

            <!-- TTS Reading Button -->
            <button id="tts-btn" onclick="toggleTTS()" class="px-3 py-1.5 rounded-lg font-semibold text-xs bg-sky-600 text-white hover:bg-sky-700 transition-colors flex items-center gap-1 hc-accent">
                <span id="tts-icon">🔊</span>
                <span id="tts-label">Leer Pantalla</span>
            </button>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main class="w-full max-w-4xl bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-4 sm:p-8 hc-card border border-slate-200 flex flex-col gap-6">

        <!-- PROGRESS BAR -->

            <div class="flex justify-between items-center mb-2">

                <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 hc-text" id="step-title">Compás de 2/4</span>
            </div>
            <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-3 overflow-hidden">
                <div id="progress-bar" class="bg-sky-500 h-full w-1/5 transition-all duration-500 ease-out"></div>
            </div>
        </div>

        <!-- DYNAMIC CONTENT STAGES -->
        <div id="stage-container" class="min-h-[420px] flex flex-col justify-between">
            <!-- Injected by JavaScript -->
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="mt-8 text-center text-xs text-slate-500 dark:text-slate-400 hc-text max-w-2xl">
        Mediación Socio-Pedagógica, Educación Inclusiva y DUA (Res. 860/25).
    </footer>

    <script>
        /* ==========================================================================
           1. AUDIO ENGINE (WEB AUDIO API - RHYTHM PLAYBACK AT 60 BPM)
           ========================================================================== */
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        /**
         * Synthesizes a woodblock/percussion click sound.
         * @param {number} time - Start time in AudioContext
         * @param {boolean} isAccent - Pitch accent for measure beat 1
         */
        function playWoodblock(time, isAccent = false) {
            const ctx = getAudioContext();
            
            // Oscillator for woodblock resonant body
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            const baseFreq = isAccent ? 850 : 600;
            osc.frequency.setValueAtTime(baseFreq, time);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.4, time + 0.05);

            gain.gain.setValueAtTime(0.8, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(time);
            osc.stop(time + 0.06);

            // Noise click for stick attack
            const bufferSize = ctx.sampleRate * 0.01;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.4, time);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.01);

            noise.connect(noiseGain);
            noiseGain.connect(ctx.destination);

            noise.start(time);
        }

        /**
         * Plays back the measure rhythm dynamically at 60 BPM (1 beat = 1.0 second)
         */
        function playMeasureRhythm() {
            const ctx = getAudioContext();
            const startTime = ctx.currentTime + 0.1;
            const bpm = 60; // Fixed tempo 60 BPM -> 1 beat = 1 sec
            const secondsPerBeat = 60 / bpm;

            const challenge = challenges[currentStep];
            const allNotes = [...challenge.presetNotes, ...selectedNotes];

            let currentBeatOffset = 0;

            allNotes.forEach((noteItem) => {
                const noteStartTime = startTime + (currentBeatOffset * secondsPerBeat);
                
                // Play main note click
                playWoodblock(noteStartTime, currentBeatOffset === 0);

                // Internal subdivision click sounds for composite/subdivided figures
                if (noteItem.subdivisions && noteItem.subdivisions.length > 1) {
                    let subOffset = 0;
                    noteItem.subdivisions.forEach((subDuration, idx) => {
                        if (idx > 0) { // skip first as it was already played
                            const subTime = startTime + ((currentBeatOffset + subOffset) * secondsPerBeat);
                            playWoodblock(subTime, false);
                        }
                        subOffset += subDuration;
                    });
                }

                currentBeatOffset += noteItem.beats;
            });
        }

        /* ==========================================================================
           2. APP STATE & CHALLENGES DATABASE
           ========================================================================== */
        let currentStep = 1;
        const totalSteps = 5;
        let fontSizeLevel = 16;
        let isTTSActive = false;
        let speechUtterance = null;
        
        let selectedNotes = [];
        let currentHintIndex = 0;

        // Challenge definitions with progressive levels
        const challenges = {
            1: {
                levelTitle: "Nivel 1: Compás de 2/4 (Figuras Básicas)",
                timeSignature: { top: "2", bottom: "4" },
                targetBeats: 2,
                presetNotes: [
                    { name: "Negra", symbol: "♩", beats: 1, subdivisions: [1] }
                ],
                availableNotes: [
                    { id: "blanca", name: "Blanca", symbol: "𝄺", beats: 2, desc: "2 tiempos", subdivisions: [2] },
                    { id: "negra", name: "Negra", symbol: "♩", beats: 1, desc: "1 tiempo", subdivisions: [1] },
                    { id: "corcheas", name: "Dos Corcheas", symbol: "♫", beats: 1, desc: "1 tiempo (1/2 + 1/2)", subdivisions: [0.5, 0.5] },
                    { id: "redonda", name: "Redonda", symbol: "𝄻", beats: 4, desc: "4 tiempos", subdivisions: [4] }
                ],
                hints: [
                    "💡 Pista 1: El compás de 2/4 permite exactamente 2 tiempos de Negra en total.",
                    "💡 Pista 2: Ya hay 1 Negra colocada (1 tiempo). Te queda libre exactamente 1 tiempo.",
                    "💡 Pista 3: Observa que tanto 1 Negra (♩) como un grupo de 2 Corcheas (♫) valen exactamente 1 tiempo."
                ],
                socraticPrompt: "¿Por qué dos Corcheas o una sola Negra llenan por igual el tiempo que faltaba?"
            },
            2: {
                levelTitle: "Nivel 2: Compás de 4/4 (Introduciendo Semicorcheas)",
                timeSignature: { top: "4", bottom: "4" },
                targetBeats: 4,
                presetNotes: [
                    { name: "Blanca", symbol: "𝄺", beats: 2, subdivisions: [2] },
                    { name: "Negra", symbol: "♩", beats: 1, subdivisions: [1] }
                ],
                availableNotes: [
                    { id: "semicorcheas", name: "Cuatro Semicorcheas", symbol: "♬♬", beats: 1, desc: "1 tiempo (4 de 1/4)", subdivisions: [0.25, 0.25, 0.25, 0.25] },
                    { id: "negra", name: "Negra", symbol: "♩", beats: 1, desc: "1 tiempo", subdivisions: [1] },
                    { id: "corcheas", name: "Dos Corcheas", symbol: "♫", beats: 1, desc: "1 tiempo", subdivisions: [0.5, 0.5] },
                    { id: "blanca", name: "Blanca", symbol: "𝄺", beats: 2, desc: "2 tiempos", subdivisions: [2] }
                ],
                hints: [
                    "💡 Pista 1: Suma las figuras del compás: Blanca (2t) + Negra (1t) = 3 tiempos cargados.",
                    "💡 Pista 2: El límite es 4 tiempos. Para llegar a 4 nos falta exactamente 1 tiempo.",
                    "💡 Pista 3: ¿Sabías que 4 Semicorcheas se tocan rápido pero juntas suman exactamente 1 tiempo?"
                ],
                socraticPrompt: "Aunque las 4 Semicorcheas son varias figuritas juntas, ¿por qué ocupan el mismo tiempo que una sola Negra?"
            },
            3: {
                levelTitle: "Nivel 3: Compás de 3/4 (Puntillo y Figuras Compuestas)",
                timeSignature: { top: "3", bottom: "4" },
                targetBeats: 3,
                presetNotes: [
                    { name: "Corchea c/p + Semicorchea", symbol: "♫.", beats: 1, subdivisions: [0.75, 0.25] }
                ],
                availableNotes: [
                    { id: "blanca_puntillo", name: "Blanca con Puntillo", symbol: "𝄺.", beats: 3, desc: "3 tiempos (2 + 1)", subdivisions: [3] },
                    { id: "blanca", name: "Blanca", symbol: "𝄺", beats: 2, desc: "2 tiempos", subdivisions: [2] },
                    { id: "negra", name: "Negra", symbol: "♩", beats: 1, desc: "1 tiempo", subdivisions: [1] },
                    { id: "corcheas", name: "Dos Corcheas", symbol: "♫", beats: 1, desc: "1 tiempo", subdivisions: [0.5, 0.5] }
                ],
                hints: [
                    "💡 Pista 1: La combinación Corchea con puntillo + Semicorchea (♫.) vale 1 tiempo en total.",
                    "💡 Pista 2: El compás es de 3/4. Si ya tenemos 1 tiempo ocupado, nos faltan 2 tiempos.",
                    "💡 Pista 3: Revisa la figura que vale exactamente 2 tiempos (o dos de 1 tiempo)."
                ],
                socraticPrompt: "El puntillo agrega la mitad del valor a una figura. ¿Cómo nos ayudó a calcular el total del compás?"
            },
            4: {
                levelTitle: "Nivel 4: Compás de 2/2 o 6/8 Rítmico (Desafío Compuesto)",
                timeSignature: { top: "6", bottom: "8" },
                targetBeats: 6, // 6 Eighth-note pulse beats
                presetNotes: [
                    { name: "Negra con Puntillo", symbol: "♩.", beats: 3, subdivisions: [3] }
                ],
                availableNotes: [
                    { id: "negra_puntillo", name: "Negra con Puntillo", symbol: "♩.", beats: 3, desc: "3 corcheas (3 pulso 8)", subdivisions: [3] },
                    { id: "tres_corcheas", name: "Tres Corcheas", symbol: "♫♪", beats: 3, desc: "3 corcheas (3 pulso 8)", subdivisions: [1, 1, 1] },
                    { id: "negra", name: "Negra", symbol: "♩", beats: 2, desc: "2 corcheas", subdivisions: [2] },
                    { id: "corchea", name: "Una Corchea", symbol: "♪", beats: 1, desc: "1 corchea", subdivisions: [1] }
                ],
                hints: [
                    "💡 Pista 1: En un compás de 6/8, contamos 6 pulsos de corchea en total.",
                    "💡 Pista 2: La Negra con puntillo (♩.) vale 3 corcheas. ¡Ya tenemos la mitad del compás (3 de 6)!",
                    "💡 Pista 3: Necesitamos otros 3 pulsos de corchea para llegar a 6."
                ],
                socraticPrompt: "¿Por qué en el 6/8 una Negra con Puntillo equivale rítmicamente a un grupo de tres corcheas?"
            }
        };

        /* ==========================================================================
           3. UI STAGE RENDERER
           ========================================================================== */
        function renderStage() {
            const container = document.getElementById('stage-container');
            const progress = document.getElementById('progress-bar');
            const stepIndicator = document.getElementById('step-indicator');
            const stepTitle = document.getElementById('step-title');

            progress.style.width = `${(currentStep / totalSteps) * 100}%`;
            stepIndicator.textContent = `Nivel ${currentStep} de ${totalSteps}`;

            if (currentStep <= 4) {
                const challenge = challenges[currentStep];
                stepTitle.textContent = challenge.levelTitle;
                
                const presetBeats = challenge.presetNotes.reduce((sum, n) => sum + n.beats, 0);
                const addedBeats = selectedNotes.reduce((sum, n) => sum + n.beats, 0);
                const totalBeats = presetBeats + addedBeats;

                container.innerHTML = `
                    <div class="flex flex-col gap-5">
                        <!-- Instructions Header -->
                        <div class="bg-sky-50 dark:bg-slate-700/50 p-4 rounded-xl border-l-4 border-sky-500 hc-card">
                            <h2 class="font-bold text-base sm:text-lg text-slate-800 dark:text-slate-100 mb-1 hc-text">
                                ${challenge.levelTitle}
                            </h2>
                            <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 hc-text">
                                Completa la estructura del compás de <strong>${challenge.timeSignature.top}/${challenge.timeSignature.bottom}</strong> para que sume exactamente <strong>${challenge.targetBeats} ${challenge.timeSignature.bottom === '8' ? 'corcheas' : 'tiempos'}</strong>.
                            </p>
                        </div>

                        <!-- VISUAL COMPÁS MEASURE WORKBENCH -->
                        <div class="bg-slate-100 dark:bg-slate-900 border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-4 sm:p-6 flex flex-wrap items-center justify-start gap-3 min-h-[140px] relative hc-card">
                            
                            <!-- Time Signature Symbol -->
                            <div class="flex flex-col items-center justify-center font-black text-2xl sm:text-3xl border-2 border-slate-800 dark:border-slate-200 px-3 py-1 rounded bg-white dark:bg-slate-800 hc-card">
                                <span>${challenge.timeSignature.top}</span>
                                <span class="border-t border-slate-800 dark:border-slate-200 w-full text-center">${challenge.timeSignature.bottom}</span>
                            </div>

                            <!-- Preset Figures -->
                            ${challenge.presetNotes.map(note => `
                                <div class="flex flex-col items-center bg-white dark:bg-slate-800 px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 shadow-sm hc-card">
                                    <span class="text-2xl sm:text-3xl note-symbol">${note.symbol}</span>
                                    <span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400 mt-1">${note.name} (${note.beats}t)</span>
                                </div>
                            `).join('')}

                            <!-- User Selected Figures -->
                            ${selectedNotes.map((note, index) => `
                                <div onclick="removeNote(${index})" class="flex flex-col items-center bg-sky-100 dark:bg-sky-900/60 border-2 border-sky-500 px-3.5 py-2.5 rounded-xl shadow-sm cursor-pointer hover:bg-red-100 dark:hover:bg-red-900/40 transition-colors group relative hc-card" title="Toca para quitar">
                                    <span class="text-2xl sm:text-3xl note-symbol text-sky-700 dark:text-sky-300 group-hover:text-red-600">${note.symbol}</span>
                                    <span class="text-[11px] font-bold text-sky-800 dark:text-sky-200 group-hover:text-red-600 mt-1">${note.name} (${note.beats}t)</span>
                                    <span class="text-[9px] text-red-500 font-bold">❌ Quitar</span>
                                </div>
                            `).join('')}

                            <!-- Capacity Indicator -->
                            <div class="ml-auto flex flex-col items-end justify-center">
                                <span class="text-xs font-bold text-slate-500 dark:text-slate-400 hc-text">Capacidad total</span>
                                <span class="text-base sm:text-lg font-black ${totalBeats === challenge.targetBeats ? 'text-emerald-600 dark:text-emerald-400' : totalBeats > challenge.targetBeats ? 'text-red-600 dark:text-red-400' : 'text-sky-600 dark:text-sky-400'}">
                                    ${totalBeats} / ${challenge.targetBeats} ${challenge.timeSignature.bottom === '8' ? 'pulsos' : 'tiempos'}
                                </span>
                            </div>
                        </div>

                        <!-- PALETTE OF MUSICAL FIGURES -->
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-2 hc-text">
                                Selecciona figuras para agregar al compás:
                            </label>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                                ${challenge.availableNotes.map(note => `
                                    <button onclick="addNote('${note.id}')" class="flex flex-col items-center justify-center p-2.5 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl hover:border-sky-500 dark:hover:border-sky-400 hover:shadow-md transition-all-custom hc-card">
                                        <span class="text-2xl sm:text-3xl note-symbol mb-1">${note.symbol}</span>
                                        <span class="font-bold text-xs sm:text-sm text-slate-800 dark:text-slate-200 hc-text">${note.name}</span>
                                        <span class="text-[10px] text-slate-500 dark:text-slate-400">${note.desc}</span>
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <!-- FEEDBACK AND EXPLANATION AREA -->
                        <div id="feedback-area" class="hidden rounded-xl p-4 transition-all"></div>

                        <!-- GRADUATED HINTS -->
                        <div class="flex flex-col gap-2">
                            <button onclick="provideGraduatedHint()" class="self-start text-xs font-bold text-amber-800 dark:text-amber-200 bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-800 px-3 py-1.5 rounded-lg hover:bg-amber-100 transition-colors flex items-center gap-1.5">
                                <span>💡</span> Pista progresiva guiada (Toca aquí)
                            </button>
                            <div id="hint-display" class="hidden text-xs sm:text-sm bg-amber-50 dark:bg-amber-900/30 text-amber-900 dark:text-amber-200 p-3 rounded-lg border border-amber-200 dark:border-amber-800"></div>
                        </div>
                    </div>

                    <!-- CONTROL BUTTONS -->
                    <div class="flex justify-between items-center mt-6 pt-4 border-t border-slate-200 dark:border-slate-700">
                        <button onclick="resetCurrentMeasure()" class="px-3.5 py-2 text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">
                            🔄 Reiniciar compás
                        </button>
                        <button onclick="verifyMeasure()" class="px-5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white text-xs sm:text-sm font-bold rounded-xl shadow-md transition-all hc-accent">
                            Comprobar mi respuesta
                        </button>
                    </div>
                `;
            } else {
                /* STAGE 5: METACOGNITION */
                stepTitle.textContent = "Nivel 5: Reflexión Metacognitiva";
                container.innerHTML = `
                    <div class="flex flex-col gap-6">
                        <div class="bg-emerald-50 dark:bg-emerald-950/40 p-4 rounded-xl border-l-4 border-emerald-500 hc-card">
                            <h2 class="font-bold text-lg sm:text-xl text-slate-800 dark:text-slate-100 mb-1 hc-text">
                                🎉 ¡Felicitaciones! Has completado la exploración rítmica.
                            </h2>
                            <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 hc-text">
                                Reflexiona sobre tu propio proceso de aprendizaje y las estrategias que aplicaste durante los ejercicios.
                            </p>
                        </div>

                        <div class="flex flex-col gap-4">
                            <div class="bg-slate-50 dark:bg-slate-700/50 p-4 rounded-xl border border-slate-200 dark:border-slate-600">
                                <label for="reflection-1" class="block font-bold text-xs sm:text-sm text-slate-800 dark:text-slate-200 mb-2 hc-text">
                                    1. ¿Qué estrategia te ayudó a calcular el valor de las figuras más complejas (como las semicorcheas o figuras con puntillo)?
                                </label>
                                <textarea id="reflection-1" rows="3" class="w-full p-3 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-white text-xs sm:text-sm focus:ring-2 focus:ring-sky-500 outline-none" placeholder="Escribe tu reflexión aquí..."></textarea>
                            </div>

                            <div class="bg-slate-50 dark:bg-slate-700/50 p-4 rounded-xl border border-slate-200 dark:border-slate-600">
                                <label for="reflection-2" class="block font-bold text-xs sm:text-sm text-slate-800 dark:text-slate-200 mb-2 hc-text">
                                    2. Cuando un compás se pasaba de capacidad, ¿qué razonamiento usaste para ajustar las figuras correctamente?
                                </label>
                                <textarea id="reflection-2" rows="3" class="w-full p-3 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-white text-xs sm:text-sm focus:ring-2 focus:ring-sky-500 outline-none" placeholder="Escribe tu reflexión aquí..."></textarea>
                            </div>
                        </div>

                        <div id="reflection-feedback" class="hidden bg-emerald-100 dark:bg-emerald-900/50 text-emerald-900 dark:text-emerald-100 p-4 rounded-xl text-xs sm:text-sm font-semibold"></div>
                    </div>

                    <div class="flex justify-end items-center mt-6 pt-4 border-t border-slate-200 dark:border-slate-700">
                        <button onclick="submitReflection()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow-md transition-all hc-accent">
                            Guardar Reflexión y Finalizar
                        </button>
                    </div>
                `;
            }
        }

        /* ==========================================================================
           4. WORKBENCH ACTIONS & SOCRATIC EVALUATION ENGINE
           ========================================================================== */
        function addNote(noteId) {
            const challenge = challenges[currentStep];
            const noteObj = challenge.availableNotes.find(n => n.id === noteId);
            if (noteObj) {
                selectedNotes.push({ ...noteObj });
                hideFeedback();
                renderStage();
            }
        }

        function removeNote(index) {
            selectedNotes.splice(index, 1);
            hideFeedback();
            renderStage();
        }

        function resetCurrentMeasure() {
            selectedNotes = [];
            currentHintIndex = 0;
            hideFeedback();
            renderStage();
        }

        function hideFeedback() {
            const fb = document.getElementById('feedback-area');
            if (fb) fb.classList.add('hidden');
        }

        function provideGraduatedHint() {
            const challenge = challenges[currentStep];
            const hintDisplay = document.getElementById('hint-display');
            if (!hintDisplay) return;

            hintDisplay.classList.remove('hidden');
            hintDisplay.innerHTML = challenge.hints[currentHintIndex];

            if (currentHintIndex < challenge.hints.length - 1) {
                currentHintIndex++;
            }
        }

        /**
         * Verifies current measure state, playing rhythmic audio on success or showing explicit error reasons on failure
         */
        function verifyMeasure() {
            const challenge = challenges[currentStep];
            const presetBeats = challenge.presetNotes.reduce((sum, n) => sum + n.beats, 0);
            const userBeats = selectedNotes.reduce((sum, n) => sum + n.beats, 0);
            const totalBeats = presetBeats + userBeats;

            const fb = document.getElementById('feedback-area');
            fb.classList.remove('hidden', 'bg-emerald-100', 'bg-red-100', 'bg-amber-100', 'text-emerald-900', 'text-red-900', 'text-amber-900');

            if (totalBeats === challenge.targetBeats) {
                // SUCCESS: Play audio rhythm at 60 BPM & show prompt
                playMeasureRhythm();

                fb.classList.add('bg-emerald-100', 'dark:bg-emerald-950/60', 'text-emerald-900', 'dark:text-emerald-100', 'border-l-4', 'border-emerald-500');
                fb.innerHTML = `
                    <div class="flex flex-col gap-2">
                        <p class="font-bold text-sm sm:text-base">🎉 ¡Respuesta Correcta! Escucha el ritmo en acción:</p>
                        <p class="text-xs sm:text-sm">Lograste sumar exactamente los <strong>${challenge.targetBeats} tiempos</strong> que tolera este compás.</p>
                        
                        <!-- Rhythmic Audio Replay Button -->
                        <div class="mt-1 flex flex-wrap items-center gap-3">
                            <button onclick="playMeasureRhythm()" class="px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-bold transition-colors flex items-center gap-2 shadow">
                                🔊 Escuchar ritmo de este compás (60 BPM)
                            </button>
                        </div>

                        <p class="text-xs font-semibold italic bg-white/60 dark:bg-slate-800/60 p-2 rounded mt-2">${challenge.socraticPrompt}</p>
                        
                        <button onclick="nextStep()" class="mt-2 self-start px-4 py-2 bg-sky-600 text-white rounded-lg text-xs font-bold hover:bg-sky-700 transition-colors">
                            Siguiente Nivel ➡️
                        </button>
                    </div>
                `;
            } else if (totalBeats > challenge.targetBeats) {
                // EXPLICIT ERROR EXPLANATION: OVERFLOW
                const overflow = totalBeats - challenge.targetBeats;
                fb.classList.add('bg-red-100', 'dark:bg-red-950/60', 'text-red-900', 'dark:text-red-100', 'border-l-4', 'border-red-500');
                fb.innerHTML = `
                    <p class="font-bold text-xs sm:text-sm mb-1">❌ MOTIVO DEL ERROR (El compás se desbordó):</p>
                    <p class="text-xs sm:text-sm">
                        Al agregar esas figuras, el compás suma <strong>${totalBeats} tiempos</strong>, pero la regla de este compás es que solo soporta un máximo de <strong>${challenge.targetBeats} tiempos</strong>. Por lo tanto, <strong>te están sobra ${overflow} tiempo(s)</strong>.
                    </p>
                    <p class="text-xs font-bold mt-2 text-red-800 dark:text-red-200">
                        💡 Pregunta para pensar: ¿Qué figura podrías quitar o cambiar por una más corta para reducir exactamente ${overflow} tiempo(s)?
                    </p>
                `;
            } else {
                // EXPLICIT ERROR EXPLANATION: UNDERFLOW
                const missing = challenge.targetBeats - totalBeats;
                fb.classList.add('bg-amber-100', 'dark:bg-amber-950/60', 'text-amber-900', 'dark:text-amber-100', 'border-l-4', 'border-amber-500');
                fb.innerHTML = `
                    <p class="font-bold text-xs sm:text-sm mb-1">⚠️ MOTIVO DEL ERROR (Compás incompleto):</p>
                    <p class="text-xs sm:text-sm">
                        Las figuras elegidas suman <strong>${totalBeats} tiempos</strong> en total. Como el compás requiere exactamente <strong>${challenge.targetBeats} tiempos</strong>, todavía <strong>te falta(n) ${missing} tiempo(s)</strong> para completarlo.
                    </p>
                    <p class="text-xs font-bold mt-2 text-amber-800 dark:text-amber-200">
                        💡 Pregunta para pensar: ¿Cuál de las figuras disponibles equivale exactamente a esos ${missing} tiempo(s) que faltan?
                    </p>
                `;
            }
        }

        function nextStep() {
            selectedNotes = [];
            currentHintIndex = 0;
            currentStep++;
            renderStage();
        }

        function submitReflection() {
            const r1 = document.getElementById('reflection-1').value.trim();
            const r2 = document.getElementById('reflection-2').value.trim();

            const fb = document.getElementById('reflection-feedback');
            
            if (!r1 || !r2) {
                fb.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-900');
                fb.classList.add('bg-amber-100', 'text-amber-900');
                fb.textContent = "Por favor, escribe tus breves reflexiones antes de finalizar el laboratorio.";
                return;
            }

            fb.classList.remove('hidden', 'bg-amber-100', 'text-amber-900');
            fb.classList.add('bg-emerald-100', 'text-emerald-900');
            fb.innerHTML = `
                ✨ <strong>¡Reflexión metacognitiva guardada!</strong><br>
                Has demostrado un gran dominio en la comprensión de las equivalencias rítmicas. ¡Comparte tus conclusiones con tu docente!
            `;
        }

        /* ==========================================================================
           5. ACCESSIBILITY UTILITIES
           ========================================================================== */
        function adjustFontSize(delta) {
            fontSizeLevel += delta * 2;
            if (fontSizeLevel < 12) fontSizeLevel = 12;
            if (fontSizeLevel > 24) fontSizeLevel = 24;
            document.documentElement.style.setProperty('--base-font-size', `${fontSizeLevel}px`);
        }

        function toggleHighContrast() {
            document.body.classList.toggle('high-contrast');
            document.documentElement.classList.toggle('dark');
        }

        function toggleTTS() {
            const ttsIcon = document.getElementById('tts-icon');
            const ttsLabel = document.getElementById('tts-label');

            if (!('speechSynthesis' in window)) {
                alert("La síntesis de voz no está disponible en este navegador.");
                return;
            }

            if (isTTSActive) {
                window.speechSynthesis.cancel();
                isTTSActive = false;
                ttsIcon.textContent = "🔊";
                ttsLabel.textContent = "Leer Pantalla";
            } else {
                const mainContainer = document.getElementById('stage-container');
                const textToRead = mainContainer.innerText;

                speechUtterance = new SpeechSynthesisUtterance(textToRead);
                speechUtterance.lang = 'es-ES';
                speechUtterance.rate = 0.9;

                speechUtterance.onend = () => {
                    isTTSActive = false;
                    ttsIcon.textContent = "🔊";
                    ttsLabel.textContent = "Leer Pantalla";
                };

                window.speechSynthesis.speak(speechUtterance);
                isTTSActive = true;
                ttsIcon.textContent = "⏹️";
                ttsLabel.textContent = "Detener Lectura";
            }
        }

        window.onload = function() {
            renderStage();
        };
    </script>
</body>
</html>
